# The lint safety net.
#
# ARMED BY pubspec.yaml. Until the Flutter app exists this file is inert; add
# `very_good_analysis` as a dev_dependency in the same commit that creates the
# app, or the `include:` below resolves to nothing.
#
# The include filename must EXIST in the resolved very_good_analysis package. If
# it does not, analysis runs with zero added rules and the build is green while
# checking nothing — bump this filename in the same commit as any
# very_good_analysis bump, and confirm the file is really there.
include: package:very_good_analysis/analysis_options.10.3.0.yaml

analyzer:
  # The one place the generated-code globs are written down. Anything that
  # reads them (a coverage floor, a structure check) parses this file rather
  # than retyping them: excludes and coverage filters that drift apart lie the
  # coverage number upward.
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/*.drift.dart'
    - lib/l10n/gen/**

  # Only silence-producing bug classes are promoted — never style preferences.
  #
  # `errors:` RE-RANKS a diagnostic the effective ruleset already produces; it
  # cannot turn an off rule on. Eight of the nine below are enabled by
  # very_good_analysis 10.3.0. The ninth, close_sinks, is NOT in its `rules:`
  # list at all — VGA carries `close_sinks: ignore` in its own `errors:` map,
  # which re-ranks a diagnostic nothing emits — so it is switched on in the
  # `linter:` block below and only then promoted here.
  # test/policy/lint_test.dart asserts that every name here is enabled
  # somewhere in the effective config, so a promotion can never quietly become
  # a line that does nothing.
  errors:
    unawaited_futures: error
    discarded_futures: error
    empty_catches: error
    use_build_context_synchronously: error
    cancel_subscriptions: error
    close_sinks: error # enabled under linter: below; VGA does not ship it
    avoid_dynamic_calls: error
    exhaustive_cases: error
    avoid_print: error

# Rules the base set does not enable. Odova holds long-lived StreamControllers
# behind its service ports (SPEC.md §2: local notifications, the lifecycle
# flush), and a controller nobody closes is a leak with no symptom until the
# screen is opened a few hundred times.
linter:
  rules:
    - close_sinks
