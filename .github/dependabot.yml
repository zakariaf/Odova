version: 2
updates:
  # Actions are pinned by major tag; Dependabot is what tells us a major moved.
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
    commit-message: {prefix: "ci"}

  # ---------------------------------------------------------------------------
  # Armed in EPIC-01 task 1.8, which is seven tasks later than this block's own
  # instruction said. It sat commented out because Dependabot aborts the whole
  # job with "/pubspec.yaml not found" when the file is absent, and a weekly
  # red run nobody can act on is how people learn to ignore the Actions tab.
  #
  # Grouped, because Odova's dependency policy is caret-ranges-with-a-committed
  # -lock: the lock is the pin, and reviewing twelve separate bumps a week is
  # how a lock stops being read. Note that a bump still has to pass
  # `tools/audit_deps.sh` — no dependency may open a network path, whatever
  # Dependabot thinks of its version.
  #
  # tools/check_dependabot.sh keeps this armed; it strips comments before
  # looking, because the difference between an active block and a commented one
  # is the entire question.
  - package-ecosystem: pub
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "deps"}
    groups:
      dev-dependencies:
        dependency-type: development
