name: ci

# Every job below maps to a named contract, stated in a comment above the step
# that enforces it. A check with no contract behind it is gate-sprawl and does
# not belong here.
#
# The `app` and `build` jobs GUARD THEMSELVES on the presence of pubspec.yaml.
# EPIC-01 created it, so all three lanes run today; the guard stays because a
# pipeline that greps for nothing and reports green is worse than one that says
# which lane is not armed, and because it is what made the repo lane meaningful
# before there was an app.
#
# WHAT THIS PIPELINE CANNOT PROVE, stated plainly so the manual pass stays
# load-bearing:
#   * that the app makes ZERO NETWORK CALLS at runtime. CI can prove no banned
#     import exists in the source graph; the airplane-mode check from a clean
#     install is a manual release artifact.
#   * real-font rendering and on-device layout. Vazirmatn and Noto Naskh shape
#     differently on a device than on a Linux runner, and half of Odova's
#     locales are right-to-left.
#   * VoiceOver / TalkBack phrasing, and on-device notification delivery.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- always on
  repo:
    name: repo gates
    runs-on: ubuntu-24.04 # pinned, never -latest: image drift moves the toolchain with no diff to review
    timeout-minutes: 10
    outputs:
      has_app: ${{ steps.detect.outputs.has_app }}
      flutter_version: ${{ steps.toolchain.outputs.version }}
    steps:
      # Contract: the gates below can see the whole of history.
      # check_release_hygiene.sh walks `git log --all` for a credential that
      # was committed and later deleted. A shallow clone cannot see one, and
      # the gate would report OK over a leaked key.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Contract: every gate here has been SEEN to fail. A gate that has only
      # ever been green is a comment. The self-test asserts both arms.
      - name: gates can actually fail
        run: bash tools/check_gates_selftest.sh

      # Contract: no signing material in the working tree or anywhere in
      # history. Signing keys are injected from secrets at build time.
      - name: no signing material, ever
        run: bash tools/check_release_hygiene.sh

      # Contract: the worked examples in SPEC.md are valid. The backup file is
      # the whole persistence story and its example is what an engineer copies
      # into a validator; one that does not parse is a bug in the spec.
      - name: spec examples parse and agree with themselves
        run: python3 tools/check_spec_examples.py

      # Contract: every skill in .claude/skills/ has frontmatter Claude can read.
      # A ": " inside a plain YAML scalar makes the whole frontmatter unparseable;
      # the skill still loads but with EMPTY metadata, so it can never be
      # auto-invoked. Nothing warns you and `claude plugin validate` passes. Two
      # of the vendored skills shipped with exactly that bug.
      - name: skills have readable frontmatter
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/check_skill_frontmatter.py

      # Contract: lib/core/ is pure Dart — no Flutter, no dart:io, no dart:ui,
      # no intl. The first three keep the domain testable in milliseconds and
      # deterministic; the fourth is the one people add BY ACCIDENT, reaching
      # for a NumberFormat while writing a conversion, and a domain function
      # that formats has taken a locale as a hidden input — the same
      # computation then answers differently in Tehran and Toronto.
      - name: the pure core is pure
        run: bash tools/check_core_purity.sh

      # Contract: the schema version the app claims, the committed snapshots,
      # the generated ladder and the era-correct classes all agree. Bumping the
      # constant without a snapshot makes stepByStep throw on a user's device;
      # adding a snapshot without bumping it means the migration never runs.
      # Both ship silently and surface as data loss on an update. In the repo
      # job because it needs no toolchain and every push should see it.
      - name: the schema version and its snapshots agree
        run: bash tools/check_schema_freshness.sh

      # Contract: the pub ecosystem block in .github/dependabot.yml is live
      # and grouped. It shipped commented out because Dependabot aborts on a
      # missing pubspec.yaml; pubspec.yaml exists now, and this is what stops
      # the block being re-commented in a hurry.
      - name: dependabot watches pub
        run: bash tools/check_dependabot.sh

      # Contract: every gate in tools/ still parses. A gate with a syntax
      # error exits non-zero for the wrong reason, or — worse, for a Python
      # one imported rather than run — not at all.
      - name: python tooling compiles
        run: python3 -m compileall -q tools/

      # Contract: same, for the shell gates.
      - name: shell scripts are syntactically valid
        run: for f in tools/*.sh; do bash -n "$f" || exit 1; done

      # Contract: .flutter-version is the only place the toolchain version is
      # written down. It is read ONCE, here, and both Flutter jobs consume it
      # from this job's outputs — the workflow used to read it twice and the
      # comment "keep == the app job's pin" was the only thing keeping the two
      # in step.
      - id: toolchain
        name: read the pinned Flutter version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      # Contract: the Flutter lane is armed by the presence of pubspec.yaml,
      # and says out loud when it is not. A pipeline that greps for nothing and
      # reports green is worse than one that names the lane it did not run.
      - id: detect
        name: is there a Flutter app yet?
        run: |
          if [ -f pubspec.yaml ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
            echo "pubspec.yaml found — the app lane will run."
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pubspec.yaml yet. The Flutter lane is skipped."
          fi

  # ------------------------------------------------------- armed by pubspec.yaml
  app:
    name: flutter
    needs: repo
    if: needs.repo.outputs.has_app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Contract: this job analyses and tests the commit under review.
      - uses: actions/checkout@v7

      # subosito/flutter-action's `flutter-version-file` parses STRUCTURED files
      # (pubspec.yaml's environment block, .fvmrc JSON). Ours is a bare version
      # string, so the repo job reads it and both Flutter jobs take it from
      # there.
      #
      # Contract: the toolchain is the pinned one, not whatever the runner
      # image ships.
      - uses: subosito/flutter-action@v2 # v2 is current; there is no v3
        with:
          channel: stable
          flutter-version: ${{ needs.repo.outputs.flutter_version }}
          cache: true

      # Contract: the toolchain the runner actually resolved is in the log.
      # A cache hit on the wrong version is otherwise invisible.
      - run: flutter --version

      # Contract: the committed pubspec.lock IS the pin. Without
      # --enforce-lockfile a constraint or SDK change lets pub silently
      # re-resolve, and CI then reports green over a version set nobody reviewed.
      - run: flutter pub get --enforce-lockfile

      # Contract: SPEC.md §2 — no dependency opens a network path, directly or
      # transitively, and the committed lock is the pin. This lives in the app
      # job rather than the repo job because it needs the RESOLVED tree:
      # direct-only inspection of pubspec.yaml cannot see the second hop, which
      # is exactly where a banned SDK arrives.
      # --require-graph: without it the script exits 0 when it cannot obtain a
      # dependency graph, having audited nothing. In this job the transitive
      # audit is the entire reason the step exists.
      - name: no dependency opens a network path
        run: bash tools/audit_deps.sh --require-graph

      # Contract: the lint ruleset is actually loaded. analysis_options.yaml
      # names a VERSIONED file inside very_good_analysis; if that file is not
      # there, analysis runs with zero added rules and the step below reports
      # green over a codebase nobody is checking. Needs .dart_tool/, so it runs
      # after pub get. (audit_deps.sh delegates to the same script; this step
      # exists so the failure has its own name in the log — it is the silent
      # one.)
      - name: the lint include resolves
        run: bash tools/check_lint_include.sh

      # Contract: every aesthetic value in the app lives in one directory.
      # A hex, a Duration, a radius or a fontSize outside lib/theme/calm/ is a
      # component that has hardcoded one brightness — and it looks perfectly
      # correct until somebody opens the app at night.
      - name: no raw aesthetic values outside the token layer
        run: bash .claude/skills/calm-tokens/scripts/check_raw_values.sh lib

      # Contract: a new theme slot transitions and patches, or it is not a
      # slot. The compiler cannot see a field dropped from lerp — copyWith's
      # signature is ours and lerp just takes the value — so the slot silently
      # becomes a hard cut forever.
      - name: every Calm theme field survives copyWith and lerp
        run: >-
          bash .claude/skills/calm-tokens/scripts/check_extension_fields.sh
          lib/theme/calm

      # Contract: 13px is the floor, because the app is read one-handed at a
      # fuel pump in the rain. Also: no monospace anywhere, no font family
      # outside the theme layer, and no digit baked into a translated string.
      - name: the type floor holds
        run: >-
          bash .claude/skills/calm-typography-and-rtl/scripts/check_type_floor.sh
          lib lib/l10n/arb

      # Contract: tokens sit below components sit below features, and the
      # arrow never inverts. Wrapping Material is lib/ui/calm/'s job and only
      # there.
      - name: the Calm layering holds
        run: bash .claude/skills/calm-design-system/scripts/check_calm_layering.sh lib

      # Contract: presses go through CalmPressable. No InkWell, no live
      # splash, no Material substitute for a widget Calm replaces, and no
      # BoxDecoration outside lib/ui/calm/.
      - name: the Calm component hygiene holds
        run: bash .claude/skills/calm-components/scripts/check_component_hygiene.sh lib

      # Contract: 52pt is the hit floor — above Material's 48 — because the app
      # is used one-handed at a fuel pump in the rain. Also: motion is a
      # CalmMotion slot, and a reduced-motion test case may not pumpAndSettle,
      # because once the duration collapses there is nothing to settle and the
      # call hides what the case exists to assert.
      - name: the touch floor and the motion tokens hold
        run: >-
          bash .claude/skills/calm-layout-and-motion/scripts/check_touch_targets.sh
          lib test

      # Contract: the committed specimen PNGs are compared, and CI never
      # rebaselines them. A pipeline that blesses its own goldens cannot fail.
      - name: the golden lane is armed and never self-rebaselining
        run: bash tools/check_golden_lane.sh

      # Contract: one resolution point for DueState. SPEC.md §1 — never guess
      # in a way that looks like fact — is enforceable only if a single file
      # decides what "we do not know" looks like.
      - name: DueState has one resolution point
        run: >-
          bash .claude/skills/calm-due-state-and-status/scripts/check_status_encoding.sh
          lib

      # Contract: whitespace is not a review topic.
      - run: dart format --output=none --set-exit-if-changed .

      # Contract: an info is a warning that will be ignored next week.
      - run: flutter analyze --fatal-infos --fatal-warnings

      # Contract: package:drift and package:sqlite3 are imported ONLY under
      # lib/data/. A Drift symbol above the data layer means a row shape has
      # leaked past the repository boundary, and everything above it then needs
      # a database to be tested at all. An import is legal Dart wherever it
      # sits, so the compiler cannot see this one.
      - name: Drift stays inside the data layer
        run: bash tools/check_drift_confinement.sh

      # Contract: the committed .g.dart IS the schema. A stale generated file
      # compiles and runs against yesterday's tables, and for a migration
      # ladder that is not something review catches — it is a column that
      # exists in the class and not in the database. Same shape as the l10n
      # gate below: regenerate, then diff. The diff is the gate.
      - run: dart run build_runner build --delete-conflicting-outputs
      # Contract: the diff, not the regeneration, is the gate. Regenerating is
      # a setup step; this is the step that can fail.
      - name: generated Drift code is up to date
        run: git diff --exit-code -- '*.g.dart'

      # Contract: the committed generated localizations ARE the ARB files. A
      # stale lib/l10n/gen/ compiles and runs, serving yesterday's strings — and
      # with six locales that is not something review catches. Regenerate, then
      # diff: the regeneration is not itself a gate, the diff is.
      - run: flutter gen-l10n
      # Contract: the diff, not the regeneration, is the gate. Regenerating is
      # a setup step; this is the step that can fail.
      - name: generated localizations are up to date
        run: git diff --exit-code -- lib/l10n/gen/

      # Contract: randomized ordering is free detection of inter-test state
      # leakage. Coverage is collected in the SAME run, never a second pass.
      # Goldens are excluded: reference PNGs are authored on macOS, cross-OS
      # rasterisation differs, and a gate that goes red for the host instead of
      # the code is a gate that gets switched off.
      - run: flutter test --coverage --test-randomize-ordering-seed random --exclude-tags golden --reporter expanded

      # Contract: the six ARB files are a contract with five translators who
      # cannot read the code, and for three locales cannot be read back by the
      # person who wrote them. The five structural gates in
      # test/l10n/arb_template_test.dart pass trivially on a clean file, so
      # this plants each violation in turn and asserts red — a description
      # deleted, a placeholder untyped, a key that is not a Dart identifier, a
      # bidi control, a baked digit, a missing CLDR plural category.
      - name: the ARB contract has been seen to fail
        run: bash tools/check_arb_selftest.sh

      # Contract: the two pseudo-locales are GENERATED, never hand-edited.
      # SPEC.md §5 testing items 2 and 3: en-XA finds a hard-coded string
      # (anything that renders unaccented never went through the translation
      # layer) and ar-XB finds a hard-coded left/right without anybody having
      # to read Arabic. A hand-maintained one drifts from the template, and one
      # missing a key cannot report the string it exists to find — so this
      # regenerates them and the tree has to be unchanged.
      - name: the pseudo-locales are current
        run: |
          dart run tool/build_pseudo_locales.dart
          git diff --exit-code -- test/fixtures/

      # Contract: SPEC.md §5's four disambiguation branches have each been
      # SEEN to fail. A wrong answer in normalizeNumericInput does not throw —
      # it records 15 litres as 1.5 and poisons a consumption history nobody
      # will re-derive — so each branch is mutated in turn and the suite has to
      # notice.
      - name: the numeric normaliser has been seen to fail
        run: bash tools/check_numeric_input_selftest.sh

      # Contract: SPEC.md §17's fuel fixture suite was GENERATED, not
      # hand-edited. A vector edited by hand to match a bug is worse than no
      # vector at all, because it carries the authority of a golden file — and
      # the only way to tell is to regenerate and diff.
      #
      # Both steps run HERE and not in the `repo` job, because they need
      # `dart`. The self-test lived there for one commit, where every arm that
      # expected a red exit passed on 127 — "command not found" — while the two
      # expecting green failed. A self-test in a lane without its toolchain
      # reports that a gate has been seen to fail when the gate never ran.
      - name: the fuel vectors match their generator
        run: dart run tools/regen_fuel_vectors.dart --check

      # Contract: the gate above has been SEEN TO FAIL. It plants a one-digit
      # edit and a deleted case in the committed fixture and asserts red for
      # each, then asserts green again. CLAUDE.md §4 — new gate, new self-test,
      # otherwise it is a comment that runs.
      - name: the fuel-vector gate has been seen to fail
        run: bash tools/check_vectors_selftest.sh

      # Contract: SPEC.md §17's data-safety gate — a migration loses no record.
      # 12,000 records, with row counts AND a content hash either side. Counts
      # alone would not notice a migration that copied the right NUMBER of rows
      # with the wrong values in them, which is what a mis-mapped column does
      # and is the failure that survives review, because everything still looks
      # populated. Its own step so the failure has its own name in the log.
      - name: a migration loses no record
        run: flutter test test/migration/

      # Contract: lib/core/ really does run with no widget binding. The
      # structure test proves it imports no Flutter; this proves the tests
      # EXECUTE without one, which is what makes EPIC-06's fuel maths and
      # EPIC-07's due engine testable in milliseconds at every threshold. A
      # pubspec comment claiming a `dart test` tier that nothing runs is a
      # claim, not a tier.
      - name: the pure core runs without Flutter
        run: dart test test/core

      # Contract: the published coverage report covers only code somebody
      # wrote. Generated code is large and fully exercised by its callers, so
      # leaving it in inflates the number by thousands of lines. The globs are
      # read from analysis_options.yaml, never retyped — a coverage filter that
      # drifts from the analyzer excludes lies the number upward. Coverage is a
      # report and never a gate: there is no threshold anywhere in this file.
      - name: strip generated code from the coverage report
        run: bash tools/strip_generated_from_lcov.sh coverage/lcov.info

      # Contract: the coverage number leaves this pipeline as a downloadable
      # report and nothing else. `if: always()` so a red test run still
      # publishes what it managed to collect.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  # The goldens are host-specific, and that is not a defect to be tolerated
  # away: Skia rasterises text differently on macOS and Linux, so 80 of the 88
  # PNGs differ by 0.03-0.61% across hosts. A percentage tolerance wide enough
  # to absorb that is wide enough to absorb a real one-shade regression, and a
  # gate that goes red for the host instead of the code is a gate that gets
  # switched off. So the lane runs on the platform the PNGs were authored on.
  # Free here: macOS runners are not billed for a public repository.
  #
  # Regenerating them on any other machine is what the `run-goldens-rebaseline`
  # runbook is for, and it has to happen on macOS too.
  goldens:
    name: goldens
    needs: repo
    if: needs.repo.outputs.has_app == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      # Contract: this job compares the commit under review.
      - uses: actions/checkout@v7

      # Contract: the toolchain is the pinned one, not whatever the runner
      # image ships.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.repo.outputs.flutter_version }}
          cache: true

      # Contract: the toolchain the runner actually resolved is in the log.
      - run: flutter --version

      # Contract: the committed pubspec.lock IS the pin.
      - run: flutter pub get --enforce-lockfile

      # Contract: the 88 committed specimen PNGs are actually compared against.
      # Their own lane, because a golden failure is a different conversation
      # from a logic failure — it is either an intended visual change that has
      # to be blessed, or a rendering difference nobody meant. Never with the
      # rebaseline flag: a pipeline that rebaselines its own goldens cannot
      # fail, and tools/check_golden_lane.sh proves that in both directions.
      - name: the specimen goldens match
        run: flutter test --tags golden --reporter expanded

      # Contract: the comparator's 0.05% tolerance has been SEEN to reject a
      # real change. Byte-exact comparison across machines measures Skia's
      # rasteriser rather than the design — 70 of 88 differ by 1-21px between
      # two macOS builds — so the comparison is bounded; a bound nobody has
      # watched go red is a tolerance, not a gate. This shifts one palette
      # value by a single hex step, which no person can see, and asserts the
      # lane fails.
      - name: the golden tolerance has been seen to fail
        run: bash tools/check_goldens_selftest.sh

      # Contract: a failed golden is reviewable. The comparator writes the
      # actual/expected/diff triple, and without this they die with the runner.
      - name: keep the failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/ui/calm/goldens/failures/
          if-no-files-found: ignore

  build:
    name: android build
    needs: [repo, app]
    if: needs.repo.outputs.has_app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Contract: this job compiles the same commit the tests ran against.
      - uses: actions/checkout@v7
      # Contract: the Android toolchain is pinned. Gradle picks a JDK from the
      # runner image otherwise, and the image moves.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # Contract: the same pinned toolchain the app job used.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.repo.outputs.flutter_version }}
          cache: true

      # Contract: the same resolved version set the app job tested.
      - run: flutter pub get --enforce-lockfile

      # Contract: the app still compiles for a real target. Unsigned on purpose —
      # no signing secret in this job means there is nothing here to leak.
      - run: flutter build apk --debug
