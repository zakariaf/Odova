name: odova
description: "An offline, account-free log for car maintenance, fuel and running costs."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # An injectable now(). SPEC.md §3's due engine is a pure function of the
  # date, so the date has to be an argument and never a global.
  clock: ^1.1.3
  # SHA-256 for the backup file's `content_hash`. SPEC.md §6 §2.6 makes it an
  # INTEGRITY check and not a signature — §2 has no server and no key, so
  # anybody can recompute it after editing the file. What it catches is a
  # truncated download or a half-written file, which is the failure that
  # actually happens to a backup.
  #
  # Pure Dart, no plugin, no platform channel, and its own dependencies are
  # `typed_data` and `collection` — `tools/audit_deps.sh` walks the resolved
  # tree and finds no socket.
  #
  # It was a DEV dependency until EPIC-15, for the zero-record-loss oracle's
  # own hash. It ships now because the backup file carries one, and the two
  # uses are the same function for the same reason: noticing that a copy of
  # the data differs from the original in a way a record count cannot see.
  crypto: ^3.0.7
  # SQLite with a typed Dart API and real migrations. Chosen over sqflite for
  # the migration ladder specifically: SPEC.md §6.3.3 requires a step-by-step
  # migration whose every from->to pair is tested against a committed schema
  # snapshot, and drift_dev generates those snapshots. Losing eight years of
  # service history is the worst bug this app can have (SPEC.md §2), so the
  # migration machinery is the reason for the dependency, not a side effect.
  drift: ^2.28.2
  flutter:
    sdk: flutter
  # The one plugin that talks to the OS notification centre. SPEC.md §4 is the
  # whole reason: a reminder that only exists inside the app is a reminder for
  # somebody who already opened the app.
  #
  # Opens NO socket, and this was checked rather than assumed — its transitive
  # tree is timezone, clock and the platform channels, and `tools/audit_deps.sh`
  # walks it and reports clean. There is no allowlist to add it to: audit_deps.py
  # says so in a comment, deliberately, and the packages are not banned.
  #
  # The alternative was a foreground-only in-app reminder, which is what the app
  # already has. §6.4 is explicit that notifications are an accelerant and no
  # feature may depend on delivery — so this dependency buys reach, not
  # correctness, and the app stays fully usable if the user denies it forever.
  #
  # **18, not 22, and the reason is the offline gate.** `timezone` added an
  # `http` dependency in 0.10.0 — for its own tzdata-refresh tool, which this
  # app never runs — and every flutter_local_notifications from 19 upwards
  # requires timezone >= 0.10. So the newest version of this plugin puts a
  # network client in the shipped binary, and `tools/audit_deps.sh` refuses it:
  # CLAUDE.md rule 1 bans `http` permanently, and §2's store-listing claim of
  # zero network calls is meant to be true BY CONSTRUCTION rather than by
  # nobody calling it.
  #
  # 18.0.1 accepts `timezone >=0.9.0 <0.11.0`, and 0.9.4 depends on `path` and
  # nothing else. It has `zonedSchedule`, `AndroidScheduleMode`, notification
  # actions and the vm:entry-point background handler — everything §4 needs.
  #
  # The cost is real and worth stating: this pin holds the plugin back, and a
  # security fix in 19+ would force the choice again. Revisit when `timezone`
  # moves `http` to a dev dependency, which is where it belongs — it is
  # tooling, not runtime. Until then the ban wins, because a transitively
  # shipped HTTP client makes the store listing false whether or not anything
  # calls it.
  flutter_local_notifications: ^18.0.1
  flutter_localizations:
    sdk: flutter
  # State AND dependency injection. Deciding that here is what stops get_it
  # arriving in epic seven.
  flutter_riverpod: ^3.0.0
  # The device's IANA zone name, once, at startup. SPEC.md §4.5 stores a
  # notification as wall-clock and resolves it in the CURRENT zone at schedule
  # time, so a user who flies Berlin -> Tehran still gets 09:00 local. Without
  # this, `timezone` defaults to UTC and every reminder fires at the wrong hour
  # for anyone not on GMT — silently, and only on their device.
  flutter_timezone: ^4.1.1
  # The router. SPEC.md §7 needs one navigation graph with typed locations,
  # a real `errorBuilder` and a shell whose four tabs each keep their own
  # stack — `StatefulShellRoute.indexedStack` is the reason for the package
  # rather than Navigator 1.0, because "the app never switches tabs under the
  # user's finger" is a per-branch history and not a page swap.
  #
  # Opens no socket: `tools/audit_deps.sh` walks its transitive tree and it
  # reaches nothing banned.
  go_router: ^17.5.0
  # Bidi, numeral systems and the CLDR plural categories. SPEC.md §5 needs all
  # three before there is a second string.
  intl: ^0.20.2
  # `@immutable` on the Result/Failure spine and on RecordId. A direct import
  # in lib/core/, so a direct dependency — it arrives transitively through
  # flutter either way, and relying on that is how a transitive bump becomes a
  # compile error in a file that never mentioned the package.
  meta: ^1.18.0
  # Where the database file goes. The application SUPPORT directory, not
  # Documents: on iOS, Documents is user-visible and iCloud-backed, and a
  # half-written WAL syncing to iCloud is a corruption vector for a file the
  # user cannot regenerate.
  path_provider: ^2.1.5
  # `applyPragmas` takes a raw `sqlite3` Database, so the package is a DIRECT
  # dependency and is declared as one. It arrives transitively through drift
  # either way; relying on that is how a transitive bump becomes a compile
  # error in a file that never mentioned it.
  # The PDF writer for SPEC.md §12's service report. Pure Dart: its whole
  # transitive tree is archive, image, xml, barcode, qr, bidi and path — local
  # processing, no socket, no platform channel, nothing that can reach a
  # network. `tools/audit_deps.sh` walks it and reports clean.
  #
  # `share_plus` was considered for the hand-off and REFUSED. It drags in
  # `url_launcher_web`, `url_launcher_linux` and `url_launcher_windows`, which
  # are navigation surfaces — and §2's claim is that the store listing's "zero
  # network calls" is true BY CONSTRUCTION, not by which platform we happen to
  # ship. The share sheet is one platform intent; it gets a method channel of
  # our own rather than a package that can open a URL.
  pdf: ^3.11.0
  sqlite3: ^2.9.1
  # The SQLite binary itself, bundled. Without it the app uses whatever SQLite
  # the OS shipped, which on older Android is too old for STRICT tables — and
  # STRICT is what makes a wrong column type impossible rather than unlikely.
  sqlite3_flutter_libs: ^0.5.42
  # The TZDatabase the line above names. Bundled data, no lookup, no network:
  # 0.9.4's only dependency is `path`. Capped below 0.10.0 on purpose — see the
  # note on flutter_local_notifications above. Do not widen this to ^0.10 to
  # take a newer plugin; that is the change that puts `http` in the binary.
  timezone: ^0.9.4

dev_dependencies:
  # Drift's code generator and the schema-snapshot tooling. Dev-only: the
  # generated .g.dart is committed, so no generator ships.
  build_runner: ^2.10.1
  # An INDEPENDENT CSV parser, for EPIC-15 task 15.8. DEV-ONLY and pure Dart —
  # no I/O of any kind, let alone a socket. It is here because round-tripping a
  # file through the code that wrote it proves the two halves agree with each
  # other and nothing about whether either is right: RFC 4180's quoting rules
  # are exactly the kind of thing a writer and a matching reader can both get
  # wrong in the same direction. `tools/audit_deps.sh` walks the resolved tree.
  csv: ^6.0.0
  drift_dev: ^2.28.3
  # A controllable clock for `Timer`, from the Dart team. DEV-ONLY, and pure
  # Dart with no I/O of any kind — it replaces the zone's timers with a queue
  # it advances by hand. It is here because §11's Undo window is six seconds
  # and §10's is ten: a real-time test of either is a test that costs sixteen
  # seconds of every suite run, so it gets deleted, and then nothing asserts
  # that the window closes at all.
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  # The Flutter-free test tier. lib/core/ imports no Flutter by construction
  # (test/policy/structure_test.dart), so its tests run under `dart test` with
  # no widget binding — which is what makes the due engine and the fuel maths
  # testable in milliseconds, and what turns a stray `Widget` in lib/core/ into
  # a compile error rather than a review comment. Dev-only: it never ships.
  test: ^1.31.0
  # The ruleset analysis_options.yaml includes. Caret range; pubspec.lock is
  # the pin (dependency-hygiene rule 1).
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  # SPEC.md §5 Fonts. Vazirmatn renders the ENTIRE UI under fa/ar/ckb, Latin
  # runs included, so `VW Golf TDI 2.0` inside a Persian sentence is one line in
  # one font rather than two fonts fighting over a baseline. en/de/fr use the
  # platform font, which is a decision and not a compromise.
  #
  # One VARIABLE file, wght 100-900, taken from the upstream release
  # (github.com/rastikerdar/vazirmatn v33.003, SIL OFL 1.1). Smaller than three
  # statics, and Calm only uses 400/500/600 — but the axis has to stay live or
  # the platform's bold-text accessibility flag stops working.
  #
  # An asset, never a fetch: `google_fonts` is refused by tools/audit_deps.sh
  # and by test/policy/no_google_fonts_test.dart.
  assets:
    - assets/fonts/OFL.txt

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn[wght].ttf
