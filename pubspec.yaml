name: odova
description: "An offline, account-free log for car maintenance, fuel and running costs."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # An injectable now(). SPEC.md §3's due engine is a pure function of the
  # date, so the date has to be an argument and never a global.
  clock: ^1.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State AND dependency injection. Deciding that here is what stops get_it
  # arriving in epic seven.
  flutter_riverpod: ^3.0.0
  # Bidi, numeral systems and the CLDR plural categories. SPEC.md §5 needs all
  # three before there is a second string.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The Flutter-free test tier. lib/core/ imports no Flutter by construction
  # (test/policy/structure_test.dart), so its tests run under `dart test` with
  # no widget binding — which is what makes the due engine and the fuel maths
  # testable in milliseconds, and what turns a stray `Widget` in lib/core/ into
  # a compile error rather than a review comment. Dev-only: it never ships.
  test: ^1.31.0
  # The ruleset analysis_options.yaml includes. Caret range; pubspec.lock is
  # the pin (dependency-hygiene rule 1).
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  # SPEC.md §5 Fonts. Vazirmatn renders the ENTIRE UI under fa/ar/ckb, Latin
  # runs included, so `VW Golf TDI 2.0` inside a Persian sentence is one line in
  # one font rather than two fonts fighting over a baseline. en/de/fr use the
  # platform font, which is a decision and not a compromise.
  #
  # One VARIABLE file, wght 100-900, taken from the upstream release
  # (github.com/rastikerdar/vazirmatn v33.003, SIL OFL 1.1). Smaller than three
  # statics, and Calm only uses 400/500/600 — but the axis has to stay live or
  # the platform's bold-text accessibility flag stops working.
  #
  # An asset, never a fetch: `google_fonts` is refused by tools/audit_deps.sh
  # and by test/policy/no_google_fonts_test.dart.
  assets:
    - assets/fonts/OFL.txt

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn[wght].ttf
