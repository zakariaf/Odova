name: odova
description: "An offline, account-free log for car maintenance, fuel and running costs."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # An injectable now(). SPEC.md §3's due engine is a pure function of the
  # date, so the date has to be an argument and never a global.
  clock: ^1.1.2
  # SQLite with a typed Dart API and real migrations. Chosen over sqflite for
  # the migration ladder specifically: SPEC.md §6.3.3 requires a step-by-step
  # migration whose every from->to pair is tested against a committed schema
  # snapshot, and drift_dev generates those snapshots. Losing eight years of
  # service history is the worst bug this app can have (SPEC.md §2), so the
  # migration machinery is the reason for the dependency, not a side effect.
  drift: ^2.28.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State AND dependency injection. Deciding that here is what stops get_it
  # arriving in epic seven.
  flutter_riverpod: ^3.0.0
  # Bidi, numeral systems and the CLDR plural categories. SPEC.md §5 needs all
  # three before there is a second string.
  intl: ^0.20.2
  # Where the database file goes. The application SUPPORT directory, not
  # Documents: on iOS, Documents is user-visible and iCloud-backed, and a
  # half-written WAL syncing to iCloud is a corruption vector for a file the
  # user cannot regenerate.
  path_provider: ^2.1.5
  # `applyPragmas` takes a raw `sqlite3` Database, so the package is a DIRECT
  # dependency and is declared as one. It arrives transitively through drift
  # either way; relying on that is how a transitive bump becomes a compile
  # error in a file that never mentioned it.
  sqlite3: ^2.9.1
  # The SQLite binary itself, bundled. Without it the app uses whatever SQLite
  # the OS shipped, which on older Android is too old for STRICT tables — and
  # STRICT is what makes a wrong column type impossible rather than unlikely.
  sqlite3_flutter_libs: ^0.5.42

dev_dependencies:
  # Drift's code generator and the schema-snapshot tooling. Dev-only: the
  # generated .g.dart is committed, so no generator ships.
  build_runner: ^2.10.1
  drift_dev: ^2.28.3
  flutter_test:
    sdk: flutter
  # The Flutter-free test tier. lib/core/ imports no Flutter by construction
  # (test/policy/structure_test.dart), so its tests run under `dart test` with
  # no widget binding — which is what makes the due engine and the fuel maths
  # testable in milliseconds, and what turns a stray `Widget` in lib/core/ into
  # a compile error rather than a review comment. Dev-only: it never ships.
  test: ^1.31.0
  # The ruleset analysis_options.yaml includes. Caret range; pubspec.lock is
  # the pin (dependency-hygiene rule 1).
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  # SPEC.md §5 Fonts. Vazirmatn renders the ENTIRE UI under fa/ar/ckb, Latin
  # runs included, so `VW Golf TDI 2.0` inside a Persian sentence is one line in
  # one font rather than two fonts fighting over a baseline. en/de/fr use the
  # platform font, which is a decision and not a compromise.
  #
  # One VARIABLE file, wght 100-900, taken from the upstream release
  # (github.com/rastikerdar/vazirmatn v33.003, SIL OFL 1.1). Smaller than three
  # statics, and Calm only uses 400/500/600 — but the axis has to stay live or
  # the platform's bold-text accessibility flag stops working.
  #
  # An asset, never a fetch: `google_fonts` is refused by tools/audit_deps.sh
  # and by test/policy/no_google_fonts_test.dart.
  assets:
    - assets/fonts/OFL.txt

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn[wght].ttf
